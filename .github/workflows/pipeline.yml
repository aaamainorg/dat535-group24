name: Pipeline

permissions:
  contents: read

# Scheduled production refresh. Elhub publishes a month's data after the month ends,
# so once a month is enough. Also startable by hand.
#
# NOTE for a runner on your own laptop: a scheduled run only starts if the runner is
# online at that moment. If the laptop was asleep, the run waits in the queue until the
# runner comes online (or is dropped after 24 h) - then just start it by hand.
#
# This job uses the "main" environment (so it can read secrets stored there).
# If "main" has required reviewers, every scheduled run waits for an approval click -
# remove the "environment: main" line if the secrets are repository secrets and you
# want the monthly run to start on its own.
on:
  workflow_dispatch:
  schedule:
    # Alternative intervals (uncomment one and comment out the active line below):
    #- cron: "0 6 * * *"     # every day at 06:00 UTC
    #- cron: "0 6 * * 1"     # every Monday at 06:00 UTC
    - cron: "0 6 5 * *"      # active: monthly, the 5th at 06:00 UTC (last month's Elhub data is ready)

concurrency:
  group: norgespris-prod
  cancel-in-progress: false

jobs:
  run-pipeline:
    name: Run PySpark Pipeline (scheduled, prod)
    runs-on: self-hosted
    environment: main
    env:
      NORGESPRIS_ENV: prod               # -> landing /tmp/norgespris-landing/prod, database norgespris_prod
      FROST_CLIENT_ID: ${{ secrets.FROST_CLIENT_ID }}   # required: secret (the .env file is not in git)
      # Same period as norgespris-prod.yml - both write to the same prod data.
      NORGESPRIS_PROD_START_MONTH: ${{ vars.NORGESPRIS_PROD_START_MONTH || '2024-01' }}
      NORGESPRIS_PROD_END_MONTH: ${{ vars.NORGESPRIS_PROD_END_MONTH || '' }}
      # PostgreSQL on the runner machine: password = secret, the rest variables with defaults.
      NORGESPRIS_PG_PASSWORD: ${{ secrets.NORGESPRIS_PG_PASSWORD }}
      NORGESPRIS_PG_HOST: ${{ vars.NORGESPRIS_PG_HOST || 'localhost' }}
      NORGESPRIS_PG_PORT: ${{ vars.NORGESPRIS_PG_PORT || '5432' }}
      NORGESPRIS_PG_USER: ${{ vars.NORGESPRIS_PG_USER || 'norgespris' }}
      SPARK_LOCAL_IP: 127.0.0.1          # Spark on a Mac runner service: bind to localhost

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main                      # always the reviewed production code

      - name: Resolve landing directory
        id: landing-dir
        run: echo "dir=${NORGESPRIS_LANDING_ROOT:-/tmp/norgespris-landing}/prod" >> "$GITHUB_OUTPUT"

      - name: Set up Python and Java
        run: bash scripts/setup_env.sh

      - name: Run Pipeline
        run: |
          echo "=== Starting Data Pipeline Execution: sources -> landing -> PostgreSQL bronze ==="
          python run_pipeline.py all
          echo ""
          echo "=== All Pipelines Completed Successfully ==="

      - name: Write pipeline summary
        if: always()
        run: |
          MANIFEST="${{ steps.landing-dir.outputs.dir }}/_manifest.csv"
          echo "## Scheduled Pipeline Run #${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$MANIFEST" ]; then
            python scripts/manifest_summary.py "$MANIFEST" >> "$GITHUB_STEP_SUMMARY"
          fi
